# fly.toml app configuration file for applycanary.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'applycanary'
# Region comes from the actual `fly launch`; changing it here does not move an
# existing machine, so it is left as deployed.
primary_region = 'ams'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  # Must match PORT in the Dockerfile (8000). Fly's generated default of 8080
  # points the proxy at a socket nothing listens on.
  internal_port = 8000
  force_https = true
  # The scheduler runs inside this process: a stopped machine means no polling,
  # scoring or digests, so the machine must never auto-stop.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '60s'
    timeout = '10s'
    grace_period = '30s'
    method = 'get'
    path = '/health'

[[vm]]
  # 256mb (Fly's default) is not enough for the scheduler plus LLM calls.
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
