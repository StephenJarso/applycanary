name: release

# Builds the desktop application on a version tag and attaches the installers
# to the GitHub Release. Uses PyInstaller to bundle the Python backend +
# React frontend into a native window (pywebview).
#
# Each platform builds on its native runner: PyInstaller cannot cross-compile.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    # Built once and shared: both packages embed the same bundle, and building
    # it on each platform risks them drifting apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  linux:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: pip install -r requirements.txt pyinstaller

      - name: Build desktop app (Linux)
        run: python -m PyInstaller --clean applycanary.spec

      - name: Package Linux desktop app
        run: |
          cd dist && zip -r ApplyCanary_linux_x64.zip ApplyCanary/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/ApplyCanary_linux_x64.zip
          if-no-files-found: error

  windows:
    needs: [test, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: pip install -r requirements.txt pyinstaller

      - name: Build desktop app (Windows)
        run: python -m PyInstaller --clean applycanary.spec

      - name: Package Windows desktop app
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ApplyCanary/* `
                           -DestinationPath dist/ApplyCanary_windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/ApplyCanary_windows_x64.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist
      - run: ls -lh dist

      - name: Attach desktop app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # --clobber so re-running the workflow replaces assets rather than
          # failing on a name that already exists.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
