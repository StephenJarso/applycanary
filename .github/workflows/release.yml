name: release

# Builds the desktop application on a version tag and produces real installers:
#   Linux:   .deb package (apt/dpkg install)
#   Windows: .exe installer (NSIS wizard) + portable zip
#
# Each platform builds on its native runner: PyInstaller cannot cross-compile.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    # Built once and shared by both platform jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  linux:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev gir1.2-webkit2gtk-4.1 dpkg-dev

      - run: pip install -r requirements.txt pywebview pyinstaller

      - name: Build PyInstaller bundle
        run: python -m PyInstaller --clean applycanary.spec

      - name: Build .deb installer
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          chmod +x scripts/package_deb.sh
          ./scripts/package_deb.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/ApplyCanary_*.deb
          if-no-files-found: error

  windows:
    needs: [test, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - run: pip install -r requirements.txt pywebview pyinstaller

      - name: Build PyInstaller bundle
        run: python -m PyInstaller --clean applycanary.spec

      - name: Build .exe installer (NSIS)
        shell: bash
        run: |
          # Download NSIS
          choco install nsis -y --no-progress 2>/dev/null || true
          NSIS_PATH="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$NSIS_PATH" ]; then
            NSIS_PATH="$(which makensis.exe 2>/dev/null || echo '')"
          fi
          if [ -n "$NSIS_PATH" ] && [ -f "$NSIS_PATH" ]; then
            "$NSIS_PATH" scripts/installer.nsi
            echo "NSIS installer built"
          else
            echo "NSIS not found — skipping .exe installer, producing portable zip"
          fi

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ApplyCanary/* `
                           -DestinationPath dist/ApplyCanary_windows_portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/ApplyCanary_windows_x64_setup.exe
            dist/ApplyCanary_windows_portable.zip
          if-no-files-found: warn

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          merge-multiple: true
          path: dist
      - run: ls -lh dist/

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
