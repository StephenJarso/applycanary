name: Render keep-alive

# Render's free plan spins a web service down after 15 minutes without traffic.
# A scheduled /health request keeps the process (and therefore the APScheduler
# poller) awake. Set a repository variable named RENDER_URL to the service
# origin, e.g. https://applycanary.onrender.com (Settings -> Secrets and
# variables -> Actions -> Variables).
#
# GitHub may delay scheduled runs under load, and disables schedules in repos
# with no activity for 60 days. For a guaranteed ping, point a free external
# monitor (cron-job.org, UptimeRobot) at the same /health URL instead.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          set -eu
          if [ -z "${RENDER_URL:-}" ]; then
            echo "::error::Set the RENDER_URL repository variable (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 "${RENDER_URL%/}/health"
