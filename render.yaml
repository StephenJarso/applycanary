# Render Blueprint — ApplyCanary
#
# Deploy with: Dashboard → New → Blueprint → pick this repo
# (or `render blueprint launch` from the CLI). See docs/DEPLOY_RENDER.md.
#
# The service runs the repo's multi-stage Dockerfile, which builds the React
# bundle and the Python venv and serves both from one process — same image as
# docker-compose.yml. No explicit port config is needed: Render detects the
# listening port from the PORT env var automatically.
#
# NOTE on the free plan: Free web services cannot attach persistent disks and
# spin down after 15 idle minutes. Point DATABASE_URL at a managed database
# (CockroachDB Cloud free tier) so data survives; the scheduler sleeps while
# the service is spun down unless you keep it warm (see DEPLOY_RENDER.md).

services:
  - type: web
    name: applycanary
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Dockerfile is auto-detected at the repo root; nothing to override.
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DATA_DIR
        value: /data
      # Data durability: sign up at https://supabase.com (free tier, no card,
      # 500 MB Postgres with pgvector) and create a project. Copy the
      # connection string from Project Settings -> Database -> Connection
      # string -> Session pooler (port 5432, IPv4) and paste it at deploy time
      # (`sync: false` — it contains the DB password and must not live in a
      # committed file). Format:
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      # Tables are created automatically on first connect.
      #
      # DO NOT fall back to SQLite here: Render's free tier has no persistent
      # volume, so sqlite:////data/applycanary.db would be wiped on every
      # redeploy/spin-down. If you must run without a hosted DB (paid plan
      # with a disk), replace this entry with the sqlite value.
      - key: DATABASE_URL
        sync: false
      # Cron jobs (digest, github refresh, expiry) run on local time;
      # containers default to UTC.
      - key: TZ
        value: Africa/Nairobi
      # Redeploys regenerate the cookie-nonce and log every user out when this
      # changes. generateValue creates a random secret once and keeps it.
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      # Safety gate stays off until dry-run submissions have been reviewed.
      - key: ENABLE_AUTO_SUBMIT
        value: "false"
      # Links inside emails (verify/reset) need an absolute origin. Set this
      # to your Render URL (e.g. https://applycanary.onrender.com) after the
      # first deploy, then redeploy once so it takes effect. Since
      # REQUIRE_EMAIL_VERIFICATION below is on, this MUST be set before any
      # signup happens — without it the verification email is skipped rather
      # than sent with a dead link, and the pinned signup is stuck at the
      # gate (that failure is silent).
      - key: PUBLIC_BASE_URL
        sync: false
      # Require a verified email before any sign-in gets a session (register
      # returns session_started=false; login 403s with a resend prompt until
      # the emailed link is clicked). Turning this on REQUIRES a mail backend
      # (RESEND_API_KEY or SMTP): with the gate on and no mail backend, every
      # signup is locked out and the resend path fails silently. Verify a
      # confirmation mail arrives for your own address before inviting others.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      # LLM provider for scoring/tailoring — at least one is needed for smart
      # scoring (GEMINI_API_KEY, XAI_API_KEY, GROQ_API_KEY, ANTHROPIC_API_KEY…).
      - key: GEMINI_API_KEY
        sync: false
      # Optional CockroachDB Cloud ops (agent access; unrelated to DATABASE_URL).
      - key: COCKROACH_MCP_TOKEN
        sync: false
        # harmless to keep; only used by scripts/ccloud/* tooling
      # Email: on Render's free plan SMTP ports (25/465/587) are blocked, so use
      # RESEND_API_KEY (HTTPS API) rather than SMTP_*. Required when
      # REQUIRE_EMAIL_VERIFICATION is on (see that block above).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ApplyCanary@resend.dev
        # For production deliveries: verify a domain at resend.com/domains and
        # change this to a real sender, e.g. "ApplyCanary <noreply@your-domain>".
        # The default @resend.dev sandbox sender only reaches YOUR inbox.
      # Optional: prefill a shared signup code while on open registration.
      - key: DEFAULT_INVITE_CODE
        sync: false
