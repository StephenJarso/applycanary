# Curated companies polled directly on their own ATS board.
#
# This is the highest-signal, fastest source: a posting appears here before it
# propagates to aggregators, which is where the fast-apply advantage comes from.
#
# Find a company's board token from its careers URL:
#   boards.greenhouse.io/ACME          -> platform: greenhouse, token: ACME
#   jobs.lever.co/ACME                 -> platform: lever,      token: ACME
#   jobs.ashbyhq.com/ACME              -> platform: ashby,       token: ACME
#   jobs.smartrecruiters.com/ACME      -> platform: smartrecruiters, token: ACME
#   apply.workable.com/ACME            -> platform: workable,   token: ACME
#
# Verify a token before relying on it:
#   python3 scripts/verify_sources.py --platform greenhouse --token ACME
#
# Only smartrecruiters supports automated submission; everything else routes to
# the review queue.
#
# Every token below was verified live. Tokens go stale — `lever: netflix` was a
# 404 by the time it was first run — so re-verify rather than trusting this list.

companies:
  - platform: greenhouse
    token: stripe
    name: Stripe
  - platform: greenhouse
    token: airbnb
    name: Airbnb
  - platform: greenhouse
    token: gitlab
    name: GitLab
  - platform: lever
    token: spotify
    name: Spotify
  - platform: ashby
    token: ramp
    name: Ramp
  - platform: ashby
    token: linear
    name: Linear
  - platform: workable
    token: zego
    name: Zego
  # Go-heavy product teams. Official ATS boards carry the full description and
  # often the posting before it reaches an aggregator.
  - platform: greenhouse
    token: grafanalabs
    name: Grafana Labs
  - platform: greenhouse
    token: tailscale
    name: Tailscale
  - platform: greenhouse
    token: cockroachlabs
    name: Cockroach Labs
  - platform: greenhouse
    token: cloudflare
    name: Cloudflare
  - platform: greenhouse
    token: canonical
    name: Canonical
  - platform: ashby
    token: coder
    name: Coder
  - platform: greenhouse
    token: hashicorp
    name: HashiCorp
  - platform: greenhouse
    token: datadog
    name: Datadog
  - platform: greenhouse
    token: confluent
    name: Confluent
  - platform: greenhouse
    token: digitalocean
    name: DigitalOcean
  - platform: greenhouse
    token: sourcegraph
    name: Sourcegraph
  - platform: ashby
    token: planetscale
    name: PlanetScale
  - platform: lever
    token: vercel
    name: Vercel
  - platform: ashby
    token: fly
    name: Fly.io
  - platform: greenhouse
    token: mongodb
    name: MongoDB
  - platform: greenhouse
    token: elastic
    name: Elastic
  - platform: greenhouse
    token: doppler
    name: Doppler
  - platform: ashby
    token: turso
    name: Turso

# Official careers sites that are not on a supported ATS. These are parsed from
# the page itself (JSON-LD when present, otherwise title/meta/main content).
# `sitemap` + `include` is the useful shape for a site with one page per role;
# `exclude` drops listing/apply/FAQ pages, and `exclude_exact` drops an index
# page without also dropping the role pages beneath it.
careers:
  - name: HENNGE
    # Cloud security company in Tokyo; hires Go/Python engineers and runs an
    # English-speaking global internship. The careers site is WordPress, not
    # Greenhouse/Lever, so it needs the official-site connector.
    sitemap: https://recruit.hennge.com/en/wp-sitemap-posts-page-1.xml
    location: Tokyo, Japan
    include:
      - /en/mid-career-ngh/
      - /en/gip/
    exclude:
      - /apply/
      - /faq
      - /terms
      - /hennges-admission
      - /hello-
      - /translation-
      - /gip-tgt
      - /part-time
      - /recruiting-anti-harassment
    exclude_exact:
      - https://recruit.hennge.com/en/mid-career-ngh/

# Broad aggregator sources. Set enabled: false to skip one.
#
# These trade precision for reach: they carry far more postings than a single
# board, but the same job often appears on several at once. Dedup handles the
# overlap, so enabling more of them costs poll time rather than duplicate noise.
#
# All of these need no API key. Their salary figures are self-reported ranges,
# so they are stored flagged as estimates and never used to reject a job.
aggregators:
  - source: remoteok
    enabled: true
    # Client-side filter; the feed is not filterable server-side. Leave empty
    # for everything, which is noisy.
    search_terms: &terms
      - engineer
      - developer
      - backend
      - golang
      - "go developer"
      - "golang developer"
      - python
      - data

  - source: remotive
    enabled: true
    # Filterable server-side, so this is a query rather than a local filter.
    search_terms: *terms
    limit: 100

  - source: jobicy
    enabled: true
    search_terms: *terms
    count: 50

  - source: himalayas
    enabled: true
    # Capped at 50 by the API.
    limit: 50

  # Largest feed of the set and mostly Germany/EU. Filtered client-side, so it
  # is the slowest to poll; disable it if you are not targeting Europe.
  - source: arbeitnow
    enabled: true
    search_terms: *terms
    remote_only: false

  # --- Kenya / East Africa ---------------------------------------------------
  # BrighterMonday is the largest Kenyan job board. HTML scraper — reads
  # JSON-LD JobPosting from detail pages. Fragile if markup changes.
  - source: brightermonday
    enabled: true
    search_terms:
      - software
      - developer
      - engineer
      - backend
      - golang
      - python
      - tech

  # Fuzu covers Kenya, Uganda, and Nigeria. HTML scraper using JSON-LD.
  - source: fuzu
    enabled: true
    country: kenya
    search_terms:
      - software
      - developer
      - engineer
      - backend
      - golang
      - python
      - tech

  # MyJobMag Kenya. Pure HTML scraper — most fragile of the set.
  - source: myjobmag
    enabled: true
    search_terms:
      - software
      - developer
      - engineer
      - backend
      - tech

  # CareerPoint Kenya. WordPress RSS feed — lightweight, stable.
  - source: careerpointkenya
    enabled: true
    search_terms: []

  # --- Off-platform coverage via web search -----------------------------------
  # DuckDuckGo lite searches the public web for postings a board connector
  # cannot reach (e.g. jobs only on a company's own careers site). No API key
  # required; `is_scraper = True` and per-result error isolation apply.
  # `search_terms` filters the SERP; leave it empty to take the configured
  # query verbatim via `query`.
  - source: websearch
    enabled: true
    search_terms:
      - golang
      - "go developer"
      - "golang developer"
      - backend
      - engineer
      - developer

  # LinkedIn guest job search. No API key, but only public search/detail pages
  # are read and coverage is deliberately capped. Cards often show a salary;
  # applicant counts appear only when LinkedIn prints one.
  - source: linkedin
    enabled: true
    search_terms:
      - golang
      - "go developer"
      - "golang developer"
      - "backend engineer golang"
      - "software engineer golang"
      - software engineer internship
      - new grad software engineer
    location: ""
    max_results: 50
    max_queries: 8

  # Adzuna API — structured JSON, global, no scraping. Requires ADZUNA_APP_ID
  # and ADZUNA_APP_KEY in .env. Free tier: 500 req/month.
  - source: adzuna
    enabled: true
    search_terms: *terms
    country: us
    location: "united states"
    max_results: 50

  # Hacker News "Who is hiring?" — one long monthly thread of postings
  # made by the hiring teams themselves, often before any job board carries
  # them. Algolia's public API, no key. Good for small teams and unusual roles.
  - source: hn_hiring
    enabled: true
    search_terms:
      - engineer
      - developer
      - backend
      - golang
      - go
      - python
      - rust
      - kubernetes
      - platform
      - sre
    max_results: 120
